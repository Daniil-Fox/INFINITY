<!DOCTYPE html>
<html lang="ru" class="page">

@include('partials/head-profile.html')

<body class="page__body">
  <div class="site-container">
    @include('partials/header-profile.html')
    <main class="main">
      <section class="profile">
        <div class="container">
          <div class="settings">
            <div class="settings__container">
              <div class="settings__col">
                <div class="settings__header">
                  <h1 class="settings__title">Общее</h1>

                  <button class="btn-reset settings__btn">
                    <svg class="" width="40" height="40">
                      <use xlink:href="img/sprite.svg#pen"></use>
                    </svg>
                  </button>
                </div>
                <form action="" class="form settings__form">
                  <div class="form__field">
                    <div class="form__field-wrapper">
                      <input type="text" class="form__input input-name" name="Имя" />
                      <label class="form__label">Имя</label>
                    </div>
                  </div>
                  <div class="form__field">
                    <div class="form__field-wrapper">
                      <input type="text" class="form__input input-name" name="Фамилия" />
                      <label class="form__label">Фамилия</label>
                    </div>
                  </div>
                  <div class="form__field">
                    <div class="form__field-wrapper">
                      <input type="text" class="form__input input-only-tel" name="Телефон" />
                      <label class="form__label">Телефон</label>
                    </div>
                  </div>
                  <div class="form__field">
                    <div class="form__field-wrapper">
                      <input type="text" class="form__input input-name" name="Email" />
                      <label class="form__label">Email</label>
                    </div>
                  </div>
                  <button class="btn btn-reset btn_light form__btn" disabled>
                    Сохранить
                  </button>
                </form>
              </div>
              <div class="settings__col">
                <div class="settings__header">
                  <h2 class="settings__title">Мои кошельки</h2>
                </div>
                <button class="btn-reset btn btn_light settings__add">
                  Добавить кошелек
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
