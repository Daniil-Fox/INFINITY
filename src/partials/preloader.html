<style>
  :root {
    --pre-white-opacity: 1;
  }

  .preloader {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 1000;
    background-color: var(--it-black);
  }

  .preloader::before {
    content: "";
    position: absolute;
    inset: 0;
    background-color: #000;
    opacity: var(--pre-white-opacity, 1);
  }


  .preloader__logo-visual {
    opacity: 0;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.3);
    transform-origin: center;
    width: 20rem;
    height: auto;
    z-index: 2;
  }

  .preloader__logo-visual svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .preloader__logo-outline {
    fill: rgba(255, 255, 255, 1);
  }

  .preloader__video {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(2);
    width: 40rem;
    height: auto;
  }

  .preloader__video video {
    width: 100%;
    height: auto;
  }

  .preloader__logo-progress {
    transform-origin: left center;
    transform: scaleX(0);
  }
</style>
<div class="preloader" aria-hidden="true">
  <div class="preloader__video">
    <video src="./loader.mp4" autoplay muted loop></video>
  </div>
  <div class="preloader__logo-visual">
