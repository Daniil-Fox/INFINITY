<div class="modal" id="modal">
  <div class="modal__overlay"></div>

  <div class="container">
    <div class="modal__body">
      <div class="modal__container">
        <div class="modal__content">
          <div class="modal__header">
            <p class="modal__title">Оставить заявку</p>

            <button class="modal__close btn-reset">
              <svg width="21" height="21" viewBox="0 0 21 21" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.5 1.5L19.5 19.5M19.5 1.5L1.5 19.5" stroke-width="3" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
          </div>

          <form action="#" class="modal__form form">
            <div class="form__field form__field--long">
              <div class="form__field-wrapper">
                <input type="text" class="form__input input-name" name="Имя" id="first-name" />
                <label class="form__label" for="first-name">
                  Имя
                </label>
              </div>
            </div>
            <div class="form__field form__field--long">
              <select name="Способ связи" class="visually-hidden select-contact">
                <option value="">где с вами связаться?</option>
                <option value="Telegram">Telegram</option>
                <option value="Whatsapp">Whatsapp</option>
                <option value="Email">Email</option>
              </select>

              <div class="dropdown form__dropdown">
                <div class="dropdown__header">
                  <div class="dropdown__label">Где с вами связаться?*</div>
                  <div class="dropdown__capture">Где с вами связаться?*</div>
                  <div class="dropdown__btn">
                    <svg width="21" height="12" viewBox="0 0 21 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M1.5 1.5L10.5 10.5L19.5 1.5" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                      <path d="M1.5 1.5L10.5 10.5L19.5 1.5" stroke-opacity="0.25" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  </div>
                </div>
                <div class="dropdown__body">
                  <div class="dropdown__content">
                    <div class="dropdown__item"></div>
                    <div class="dropdown__item">Telegram</div>
                    <div class="dropdown__item">Whatsapp</div>
                    <div class="dropdown__item">Email</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="form__field form__field--long">
              <div class="form__field-wrapper">
                <input type="text" class="form__input input-tel" name="Телефон" style="display: block" id="phone" />
                <input type="email" class="form__input input-email" name="Почта" style="display: none" />
                <label class="form__label" for="phone">Телефон/Почта*</label>
              </div>
            </div>

            <button class="btn-reset btn form__btn" disabled>Оставить заявку</button>
          </form>
        </div>

        <div class="modal__img">
          <picture>
            <source srcset="./img/cta.webp" type="image/webp">
            <img loading="lazy" src="./img/cta.jpg" class="image" width="896" height="670" alt="">
          </picture>
        </div>
      </div>
    </div>
  </div>
</div>
